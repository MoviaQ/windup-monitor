name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (lint, typecheck, build, real-Postgres tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: statuspilot
          POSTGRES_PASSWORD: statuspilot
          POSTGRES_DB: statuspilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statuspilot -d statuspilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://statuspilot:statuspilot@127.0.0.1:5432/statuspilot?schema=public
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace core
      - run: npm run typecheck --workspace core
      - run: npm run build --workspace core
      - run: npm run test --workspace core

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace web
      - run: npm run typecheck --workspace web
      - run: npm run test --workspace web
      - run: npm run build --workspace web

  agent:
    name: agent (vet, test, build linux amd64+arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - working-directory: agent
        run: go vet ./...
      - working-directory: agent
        run: go test ./...
      - working-directory: agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/windup-monitor-agent-linux-amd64 ./cmd/windup-monitor-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o bin/windup-monitor-agent-linux-arm64 ./cmd/windup-monitor-agent

  compose:
    name: compose config validity
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-dummy-password
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml config > /dev/null
      - run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.tls.yml config > /dev/null
